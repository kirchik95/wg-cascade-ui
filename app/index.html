</button>

</div>
</div>
</div>
</div>

</div>

<button class="menuitem" role="menuitem" type="button" data-act="export"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>Backup</button>

</div>

</div>
</div>

<button type="button" class="xf" data-xf="nl" aria-pressed="false" data-act="exit-filter">NL</button>
<button type="button" class="xf" data-xf="us" aria-pressed="false" data-act="exit-filter">US</button>

<script src="/app.js"></script>

<script src="/clients.js"></script>
